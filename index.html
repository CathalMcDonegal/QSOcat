<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="QSOcat — caixa d'eines per a radioaficionats VHF, UHF i HF.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="grok_1792413580931.jpg">
  <link rel="apple-touch-icon" href="grok_1792413580931.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hf-modes.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <title>QSOcat</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Enrere">‹</button>
      <div class="brand"><img src="grok_1792413580931.jpg" alt="QSOcat"><div><strong>QSOcat</strong><small>Radioafició · VHF · UHF · HF</small></div></div>
      <button class="icon-btn" id="installBtn" hidden aria-label="Instal·lar QSOcat">⇩</button>
    </header>
    <main id="screen" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Navegació principal">
      <button data-route="home">⌂<span>Inici</span></button>
      <button data-route="vhf">◉<span>VHF/UHF</span></button>
      <button data-route="hf">≈<span>HF</span></button>
      <button data-route="log">▤<span>QSO</span></button>
      <button data-route="tools">⚙<span>Eines</span></button>
    </nav>
  </div>
  <div id="toast" role="status"></div>
  <script src="repeaters.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
  <script src="radio.js"></script>
  <script src="mapfix.js"></script>
  <script src="manual.js"></script>
  <script src="hf-modes.js"></script>
  <script>
    (function(){
      let deferred=null;
      const btn=document.getElementById('installBtn');
      function show(){if(btn && !window.matchMedia('(display-mode: standalone)').matches) btn.hidden=false;}
      window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;show();});
      window.addEventListener('appinstalled',function(){deferred=null;if(btn)btn.hidden=true;});
      if(btn) btn.addEventListener('click',async function(){
        if(deferred){deferred.prompt();try{await deferred.userChoice;}catch(e){}deferred=null;btn.hidden=true;}
        else { alert('Per instal·lar QSOcat: obre el menú ⋮ del navegador i prem «Instal·lar aplicació» o «Afegir a pantalla d’inici».'); }
      });
      setTimeout(show,1500);
    })();
  </script>
</body>
</html>
